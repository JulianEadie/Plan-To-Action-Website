<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4 content-box">
    <h2>Progress T-Chart</h2>

    <table class="table table-bordered table-striped mt-3">
        <tbody>
            {% for row in data %}
            <tr>
                {% for cell in row %}
                <td>{{ cell }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a class="btn btn-outline-primary mt-3" href="/plan">Back</a>
</div>

</body>
</html>
